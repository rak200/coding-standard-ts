version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # Daily, while every other ecosystem here is weekly, and the asymmetry is the point:
  # this is the only pin whose staleness BLOCKS A MERGE. Conformance fails when a seed
  # the repository consumes changed under an old pin, so the gap between a baseline
  # release and the next Dependabot pass is a gap where every pull request opens red.
  # An outdated library is merely outdated; an outdated baseline stops the work.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    # The baseline is exempt from cooldown, and without this it never updates at all.
    # Measured on rak200/utils: the updater ran green, reported `No PRs affected`, and the
    # log said `Filtered out 26 versions due to cooldown` / `All versions filtered by
    # cooldown, falling back to current version`. Nothing here configured a cooldown —
    # the schema documents it as opt-in — so one is being applied that this file never
    # asked for, and rak200/workflow is two days old, which puts its entire history
    # inside any window. A baseline that cuts several releases a day cannot wait out a
    # feature designed to let versions settle; that is the opposite of why the schedule
    # above is daily.
    #
    # `exclude: ["*"]` rather than `default-days: 0` — the schema sets `minimum: 1` on
    # every `*-days` field except `semver-patch-days`, so zero is not expressible and
    # exclusion is the only lever that turns it off.
    cooldown:
      exclude: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev:
        patterns: ["*"]
    # A TypeScript MAJOR is held; minors and patches flow normally.
    #
    # This package ships `typescript` and `typescript-eslint` to consumers as a matched
    # pair, and the linter's peer range is what decides when the compiler may move:
    # `typescript-eslint@8.66.0` declares `peer typescript@">=4.8.4 <6.1.0"`, so with
    # TypeScript 7 published as `latest` there is no combination npm will install. The
    # bump does not fail a test — `npm ci` refuses to resolve, so nothing compiles, and
    # the group carries every other update down with it.
    #
    # REMOVE THIS WHEN the peer range admits the next major. That is a fact to check,
    # not a memory to keep:
    #
    #   npm view typescript-eslint peerDependencies.typescript
    #
    # If the printed range no longer stops below the current `typescript` major, delete
    # this block in the same pull request that takes the major. Adopting a compiler major
    # here is not a version bump: it is a change to the standard every TS repository
    # consumes, and the README's `typescript-<major>` badge is a mirror badge that CI
    # fails until it follows.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
