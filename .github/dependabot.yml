version: 2
# Every ecosystem below excludes the cooldown, and the exclusion is not a preference.
# Nothing in this file configures a cooldown — the schema documents it as opt-in — yet one
# is applied anyway, at three days. It does two kinds of damage here, both measured.
#
# It BLOCKS MERGES. A stale pin reddens a required check, so the window between a baseline
# release and the next Dependabot pass is a window where every pull request in every
# consumer opens red. Measured 2026-08-16 on rak200/ui: `Available release version/ref is
# 1.13.1` followed by `Days since release : 1 (cooldown days 3)`. The bump was withheld,
# and four repositories were carried to 1.13.1 by hand instead.
#
# On an EXACT-REF dependency it DOWNGRADES. The candidate list is tags, and the newest
# survivor of the filter can be older than the version in use — so the updater writes a
# downgrade and calls it an update. Measured the same day, same repository:
# `Filtered git tag 0.4.6 ... (2/3 cooldown days)`, `Filtered git tag 0.4.7 ... (1/3
# cooldown days)`, and the pull request it opened read `@rak200/coding-standard-ts (from
# 0.4.7 to 0.4.5)`. 0.4.5 predates the `rak200-scan` binary, so `npm run scan` exited 127.
# A semver constraint cannot do this — it can only be delayed — which is why the damage
# lands on npm git refs and workflow pins and not on Composer ranges.
#
# What a cooldown buys — time for a bad release to be found — this estate already buys
# with a gate: lint, analyse, test, the coverage floor, the mutation floor and the scanner
# all run on the bump pull request. A calendar is a weaker copy of a check that exists.
# The cost it charges, meanwhile, is merges blocked on staleness the gate itself reports.
#
# `exclude: ["*"]` rather than `default-days: 0` — the schema sets `minimum: 1` on every
# `*-days` field except `semver-patch-days`, so zero is not expressible and exclusion is
# the only lever that turns it off.
updates:
  # Daily, and it was `weekly` until 2026-08-30. This pin is graded by a CI check that reddens
  # on staleness — `The pinned pipeline is not obsolete` — so the window between a baseline
  # release and the next Dependabot pass is a window where every pull request in a consumer
  # opens red. Weekly rested on baseline releases being the rarer event; rarer is a claim about
  # frequency, where the gate makes one about blocking.
  #
  # Measured before changing it: the slots are weekly-all-Sunday and staggered per repository,
  # so `1.11.1`, published on a Thursday, was not carried until the Sunday — three days, with
  # seven the worst case for a release that misses a slot by minutes. Daily costs nothing on a
  # quiet week: grouped, with nothing upstream to move, no pull request opens.
  #
  # RFC 0017 `E.42`. The asymmetry this file used to carry rested on the claim that Dependabot
  # does not move a reusable-workflow pin at all — false, and false for three weeks before
  # anyone read the pull requests that said so.
  #
  # Declared, not inferred — see the package ecosystem below. `build` here for a reason of its
  # own: these two carry no consumer-facing half to split on. A pipeline pin and a baseline pin
  # change how this repository is BUILT, never what an installed package resolves, so they stay
  # hidden.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
  # Daily for the reason given above, and this pin was daily first: it moves several times a
  # day and its staleness stops the work. Conformance fails when a seed the repository consumes
  # changed under an old pin, so every pull request opens red until it moves. An outdated
  # library is merely outdated, which is why a library ecosystem stays weekly.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"
  # `commit-message` is DECLARED and not inferred. Absent it, Dependabot reads this
  # repository's history and picks a prefix; it picked `build`, which every seed hides, so a
  # dependency the consumer receives published nothing. Measured in `LIFECYCLE.md` §3.9.
  #
  # `dependency-type` is the closest thing Dependabot can label. What actually decides whether a
  # release is owed is whether the declared constraint moved outside its previous range — a
  # lock-only bump changes nothing for a consumer, and a library ships no lock. Dependabot cannot
  # see that; it can see production versus development, and the two coincide often enough that
  # `fix(deps)` is right far more often than `build(deps)` ever was.
  #
  # The split into two groups is not cosmetic: the prefix is chosen ONCE per pull request, so a
  # group holding both kinds cannot be labelled correctly. The single group this replaces was
  # named `dev` and carried `patterns: ["*"]` — in a `-config` repository nearly every dependency
  # is production, because the tooling IS the product.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    groups:
      runtime:
        dependency-type: "production"
      dev:
        dependency-type: "development"
    # A TypeScript MAJOR is held; minors and patches flow normally.
    #
    # This package ships `typescript` and `typescript-eslint` to consumers as a matched
    # pair, and the linter's peer range is what decides when the compiler may move:
    # `typescript-eslint@8.66.0` declares `peer typescript@">=4.8.4 <6.1.0"`, so with
    # TypeScript 7 published as `latest` there is no combination npm will install. The
    # bump does not fail a test — `npm ci` refuses to resolve, so nothing compiles, and
    # the group carries every other update down with it.
    #
    # REMOVE THIS WHEN the peer range admits the next major. That is a fact to check,
    # not a memory to keep:
    #
    #   npm view typescript-eslint peerDependencies.typescript
    #
    # If the printed range no longer stops below the current `typescript` major, delete
    # this block in the same pull request that takes the major. Adopting a compiler major
    # here is not a version bump: it is a change to the standard every TS repository
    # consumes, and the README's `typescript-<major>` badge is a mirror badge that CI
    # fails until it follows.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
